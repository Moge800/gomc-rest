name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Install icon tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          go install github.com/akavel/rsrc@v0.10.2

      - name: Generate Windows resource
        run: |
          convert assets/appicon.png -define icon:auto-resize=256,48,32,16 assets/appicon.ico
          export PATH="$(go env GOPATH)/bin:$PATH"
          rsrc -arch amd64 -ico assets/appicon.ico -o resource_windows_amd64.syso

      - name: Build (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest.exe .

      - name: Build (Linux amd64)
        run: GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest-linux-amd64 .

      - name: Build (Linux arm64)
        run: GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest-linux-arm64 .

      - name: Build (macOS amd64)
        run: GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest-darwin-amd64 .

      - name: Build (macOS arm64)
        run: GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest-darwin-arm64 .

      - name: Generate checksums
        run: sha256sum gomc-rest.exe gomc-rest-linux-amd64 gomc-rest-linux-arm64 gomc-rest-darwin-amd64 gomc-rest-darwin-arm64 > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gomc-rest.exe
            gomc-rest-linux-amd64
            gomc-rest-linux-arm64
            gomc-rest-darwin-amd64
            gomc-rest-darwin-arm64
            checksums.txt
