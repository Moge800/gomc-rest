name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-X main.version=${GITHUB_REF_NAME}" -o gomc-rest.exe .

      - name: Generate checksums
        run: sha256sum gomc-rest.exe > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gomc-rest.exe
            checksums.txt
