name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build .

      - name: Build (Windows amd64)
        run: GOOS=windows GOARCH=amd64 go build -o gomc-rest.exe .

      - name: Build (macOS amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o gomc-rest-darwin-amd64 .

      - name: Build (macOS arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o gomc-rest-darwin-arm64 .